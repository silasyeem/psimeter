name: Psimeter
options:
  bundleIdPrefix: com.silasyeem
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6U98Y8G55P
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Psimeter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: PsimeterWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: psimeter
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
        WAQIToken: $(WAQI_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silasyeem.psimeter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PsimeterWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: psimeter
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
        WAQIToken: $(WAQI_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silasyeem.psimeter.widget
        SKIP_INSTALL: YES
